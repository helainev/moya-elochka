<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления — Моя Ёлочка</title>
    <!-- Подключаем официальный актуальный Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- Подключаем иконки Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gradient-to-b from-slate-900 via-slate-800 to-emerald-950 text-slate-100 min-h-screen font-sans flex items-center justify-center p-4">

    <div class="bg-slate-800/90 backdrop-blur-md p-6 rounded-2xl shadow-2xl max-w-lg w-full border border-slate-700">
        <div class="text-center mb-6">
            <div class="text-5xl text-amber-400 mb-2"><i class="fas fa-tree"></i></div>
            <h2 class="text-2xl font-serif font-bold text-amber-400">Добавить игрушку в каталог</h2>
            <p class="text-sm text-slate-400 mt-1">Форма генерирует текст для ИИ-агента</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Название игрушки</label>
                <input type="text" id="toy-name" placeholder="Например: Зайчик в шарфе" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Стоимость</label>
                <input type="text" id="toy-price" placeholder="Например: 2 500 руб." class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Статус наличия</label>
                <select id="toy-status" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
                    <option value="instock">В наличии</option>
                    <option value="order">Под заказ</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Имена файлов картинок (через запятую, если несколько)</label>
                <input type="text" id="toy-image" placeholder="Например: elochka3.jpg, elochka3_side.jpg" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
            </div>
            
            <button onclick="generateCommand()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl transition-all shadow-lg mt-6">
                Создать команду для Агента
            </button>
        </div>

        <!-- Поле вывода команды -->
        <div id="result-box" class="mt-6 hidden">
            <label class="block text-sm text-amber-400 mb-1 font-bold">Скопируйте этот текст для agent.py:</label>
            <textarea id="command-output" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-emerald-400 font-mono focus:outline-none" readonly></textarea>
        </div>
    </div>

    <script>
        function generateCommand() {
            const name = document.getElementById('toy-name').value;
            const price = document.getElementById('toy-price').value;
            const status = document.getElementById('toy-status').value;
            const imgInput = document.getElementById('toy-image').value;
            
            if(!name || !price || !imgInput) {
                alert("Пожалуйста, заполните все поля! ❄️");
                return;
            }
            
            // Разбиваем строку по запятым и превращаем в аккуратный список картинок
            const imagesArray = imgInput.split(',').map(i => `img/${i.trim()}`);
            const statusText = status === 'instock' ? 'В наличии' : 'Доступно для заказа';
            
            // Формируем четкую команду для ИИ со списком изображений
            const cmd = `Добавь в каталог карточку. Название: '${name}', цена: '${price}', статус: '${statusText}', изображения: ${JSON.stringify(imagesArray)}. Описание придумай сам.`;
            
            document.getElementById('command-output').value = cmd;
            document.getElementById('result-box').classList.remove('hidden');
        }
    </script>
</body>
</html>
