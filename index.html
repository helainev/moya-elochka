<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Ёлочка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @keyframes snowfall {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(100vh);
            }
        }
        .snowflake {
            animation: snowfall 5s linear infinite;
            opacity: 0.5;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-900 via-slate-800 to-emerald-950 text-slate-100">
    <div id="snowfall"></div>
    <header class="text-center py-10">
        <h1 class="text-5xl font-serif text-amber-400">Моя Ёлочка</h1>
        <p class="text-xl font-cursive">Авторские ватные игрушки Ольги Деминой 🎄❄️</p>
    </header>
    <section class="flex flex-wrap justify-center gap-4 py-10">
        <a href="https://t.me/moya_elochka" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-transform hover:scale-105">
            <i class="fab fa-telegram"></i> Telegram
        </a>
        <a href="https://m.vk.ru/moya_elochka" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-transform hover:scale-105">
            <i class="fab fa-vk"></i> VK
        </a>
        <a href="https://www.instagram.com/moya_elochka/" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-transform hover:scale-105">
            <i class="fab fa-instagram"></i> Instagram
        </a>
    </section>
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 py-10">
        <div class="bg-slate-800/80 backdrop-blur rounded-2xl p-4 shadow-2xl text-center">
            <img src="img/elochka1.jpg" alt="Игрушка" class="rounded-xl max-h-96 mx-auto object-contain mb-4">
            <h3 class="text-xl font-bold mt-4">Игрушка 1</h3>
            <p class="text-base mt-2">Описание игрушки</p>
            <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-sm inline-block mt-4">В наличии</span>
            <button class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-full mt-4 flex items-center gap-2 transition-transform hover:scale-105" onclick="showOrderMenu()">
                <i class="fas fa-envelope"></i> Заказать
            </button>
        </div>
        <div class="bg-slate-800/80 backdrop-blur rounded-2xl p-4 shadow-2xl text-center">
            <img src="img/elochka2.jpg" alt="Игрушка" class="rounded-xl max-h-96 mx-auto object-contain mb-4">
            <h3 class="text-xl font-bold mt-4">Игрушка 2</h3>
            <p class="text-base mt-2">Описание игрушки</p>
            <span class="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-sm inline-block mt-4">Доступно для заказа</span>
            <button class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-full mt-4 flex items-center gap-2 transition-transform hover:scale-105" onclick="showOrderMenu()">
                <i class="fas fa-envelope"></i> Заказать
            </button>
        </div>
    </section>
    <div id="order-menu" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-slate-800/80 backdrop-blur rounded-2xl p-8 shadow-2xl text-center">
            <h2 class="text-2xl font-bold">Выберите способ заказа</h2>
            <div class="flex flex-col gap-4 mt-4">
                <a href="https://t.me/moya_elochka" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-transform hover:scale-105">
                    <i class="fab fa-telegram"></i> Telegram
                </a>
                <a href="https://m.vk.ru/moya_elochka" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-transform hover:scale-105">
                    <i class="fab fa-vk"></i> VK
                </a>
                <a href="https://www.instagram.com/moya_elochka/" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-transform hover:scale-105">
                    <i class="fab fa-instagram"></i> Instagram
                </a>
            </div>
            <button class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-full mt-4 flex items-center gap-2 transition-transform hover:scale-105" onclick="hideOrderMenu()">
                <i class="fas fa-times"></i> Закрыть
            </button>
        </div>
    </div>
    <script>
        const snowfall = document.getElementById('snowfall');
        for (let i = 0; i < 100; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake', 'w-2', 'h-2', 'bg-white', 'rounded-full', 'absolute', 'top-0', 'left-0');
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
            snowfall.appendChild(snowflake);
        }

        function showOrderMenu() {
            document.getElementById('order-menu').classList.remove('hidden');
        }

        function hideOrderMenu() {
            document.getElementById('order-menu').classList.add('hidden');
        }
    </script>
</body>
</html>
