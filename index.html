<!-- 
  ИНСТРУКЦИЯ ДЛЯ ИИ (ПРОМПТ ДЛЯ ПРАВОК):
  Сайт: Моя Ёлочка - ватные игрушки Ольги Деминой.
  Стек: HTML + Tailwind CSS + JavaScript.
  Стиль: Премиальный новогодний, глубокий ночной фон (slate-900), анимированный снегопад.
  Цвета кнопок: WhatsApp (emerald-600), VK (blue-600), Ярмарка Мастеров (red-700), Pinterest (rose-600).
  Карточки товаров: Полупрозрачные (bg-slate-800/80 backdrop-blur), rounded-2xl, пути к фото: img/elochka1.jpg.
-->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Ёлочка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @keyframes snowfall {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(100vh);
            }
        }
        .snowflake {
            animation: snowfall 5s linear infinite;
            opacity: 0.5;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-900 via-slate-800 to-emerald-950 text-slate-100">
    <div id="snowfall"></div>
    <header class="text-center py-10">
        <h1 class="text-5xl font-serif text-amber-400">Моя Ёлочка</h1>
        <p class="text-xl font-cursive">Авторские ватные игрушки Ольги Деминой 🎄❄️</p>
    </header>
    <section class="flex flex-wrap justify-center gap-4 py-10">
        <a href="https://wa.me/number" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-transform hover:scale-105">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://vk.com/username" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-transform hover:scale-105">
            <i class="fab fa-vk"></i> VK
        </a>
        <a href="https://marketmaster.ru" class="bg-red-700 hover:bg-red-800 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-transform hover:scale-105">
            Ярмарка Мастеров
        </a>
        <a href="https://pinterest.com/username" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-transform hover:scale-105">
            <i class="fab fa-pinterest"></i> Pinterest
        </a>
    </section>
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 py-10">
        <div class="bg-slate-800/80 backdrop-blur rounded-2xl p-4 shadow-2xl text-center">
            <img src="img/elochka1.jpg" alt="Игрушка" class="rounded-xl max-h-96 mx-auto object-contain mb-4">
            <h3 class="text-xl font-bold mt-4">Игрушка 1</h3>
            <p class="text-base mt-2">Описание игрушки</p>
            <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-sm inline-block mt-4">В наличии</span>
            <a href="#" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-full mt-4 flex items-center gap-2 transition-transform hover:scale-105">
                <i class="fas fa-envelope"></i> Заказать
            </a>
        </div>
        <div class="bg-slate-800/80 backdrop-blur rounded-2xl p-4 shadow-2xl text-center">
            <img src="img/elochka2.jpg" alt="Игрушка" class="rounded-xl max-h-96 mx-auto object-contain mb-4">
            <h3 class="text-xl font-bold mt-4">Игрушка 2</h3>
            <p class="text-base mt-2">Описание игрушки</p>
            <span class="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-sm inline-block mt-4">Доступно для заказа</span>
            <a href="#" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-full mt-4 flex items-center gap-2 transition-transform hover:scale-105">
                <i class="fas fa-envelope"></i> Заказать
            </a>
        </div>
    </section>
    <script>
        const snowfall = document.getElementById('snowfall');
        for (let i = 0; i < 100; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake', 'w-2', 'h-2', 'bg-white', 'rounded-full', 'absolute', 'top-0', 'left-0');
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
            snowfall.appendChild(snowflake);
        }
    </script>
</body>
</html>
