<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Ёлочка — Авторские ватные игрушки Ольги Деминой</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @keyframes snowfall {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(100vh); }
        }
        .snowflake {
            animation: snowfall 5s linear infinite;
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-900 via-slate-800 to-emerald-950 text-slate-100 min-h-screen relative overflow-x-hidden">
    
    <!-- Контейнер для падающего снега -->
    <div id="snowfall" class="absolute inset-0 pointer-events-none z-50 overflow-hidden"></div>

    <!-- Шапка сайта -->
    <header class="text-center py-12 relative z-10">
        <h1 class="text-5xl md:text-6xl font-serif font-bold text-amber-400 drop-shadow-lg">Моя Ёлочка</h1>
        <p class="text-xl md:text-2xl mt-3 italic font-light text-slate-300">Авторские ватные игрушки Ольги Деминой 🎄❄️</p>
    </header>

    <!-- Блок социальных сетей -->
    <section class="flex flex-wrap justify-center gap-4 pb-6 relative z-10 px-4">
        <a href="https://t.me/moya_elochka" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-full flex items-center gap-2 transition-all transform hover:scale-105 shadow-lg shadow-emerald-900/30">
            <i class="fab fa-telegram text-lg"></i> Telegram
        </a>
        <a href="https://m.vk.ru/moya_elochka" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-full flex items-center gap-2 transition-all transform hover:scale-105 shadow-lg shadow-blue-900/30">
            <i class="fab fa-vk text-lg"></i> ВКонтакте
        </a>
        <a href="https://www.instagram.com/moya_elochka/" target="_blank" class="bg-rose-600 hover:bg-rose-700 text-white font-medium px-5 py-2.5 rounded-full flex items-center gap-2 transition-all transform hover:scale-105 shadow-lg shadow-rose-900/30">
            <i class="fab fa-instagram text-lg"></i> Instagram
        </a>
    </section>

    <!-- Динамический каталог игрушек -->
    <main class="max-w-7xl mx-auto px-4 py-8 relative z-10">
        <section id="catalog-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="bg-slate-800/70 backdrop-blur rounded-2xl p-5 shadow-2xl text-center flex flex-col justify-between border border-slate-700/50 relative group transition-all duration-300 hover:border-amber-500/30">
                <div class="relative overflow-hidden rounded-xl bg-slate-900/40 p-2 flex items-center justify-center h-96">
                    <img id="toy-img-0" src="img/moroz1.jpg" alt="Дед Мороз" class="max-h-full max-w-full object-contain transition-all duration-300 transform">
                    <button id="toy-img-0-prev" class="absolute left-4 top-1/2 -translate-y-1/2 bg-slate-900/70 hover:bg-slate-950 text-white w-9 h-9 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20 shadow-lg border border-slate-700"><i class="fas fa-chevron-left text-sm"></i></button>
                    <button id="toy-img-0-next" class="absolute right-4 top-1/2 -translate-y-1/2 bg-slate-900/70 hover:bg-slate-950 text-white w-9 h-9 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20 shadow-lg border border-slate-700"><i class="fas fa-chevron-right text-sm"></i></button>
                </div>
                <div class="flex flex-col flex-grow justify-between">
                    <div>
                        <h3 class="text-2xl font-bold mt-4 text-slate-100 font-serif">Дед Мороз</h3>
                        <p class="text-amber-400 font-bold text-xl mt-2 tracking-wide">10500</p>
                    </div>
                    <div>
                        <p class="text-slate-300 mt-2">Дед Мороз, ведущий разговор, не забывайте об этом, если хотите вовремя получить подарок!</p>
                        <a href="https://t.me/moya_elochka" target="_blank" class="bg-slate-700 hover:bg-amber-500 hover:text-slate-950 text-white px-5 py-2.5 rounded-xl mt-4 font-bold flex items-center gap-2 transition-all justify-center shadow-md">
                            <i class="fas fa-shopping-bag"></i> Купить
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('catalog-container');
            const card = document.querySelector('.bg-slate-800/70');
            container.appendChild(card);
        });
    </script>
</body>
</html>
